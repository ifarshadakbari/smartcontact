# ----------------------------------------------------
# SmartContact Backend API
# ----------------------------------------------------
location ^~ /webapp/smartcontact/api {
    alias /www/wwwroot/ip.parszarasa.local/webapp/smartcontact/backend/public;
    try_files $uri $uri/ @smartcontact_backend_php;
}

location @smartcontact_backend_php {
    include fastcgi_params;
    fastcgi_pass unix:/tmp/php-cgi-84.sock;

    fastcgi_param SCRIPT_FILENAME /www/wwwroot/ip.parszarasa.local/webapp/smartcontact/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /www/wwwroot/ip.parszarasa.local/webapp/smartcontact/backend/public;

    # لاراول باید /api/... را ببیند:
    set $clean_uri $request_uri;
    if ($request_uri ~* "^/webapp/smartcontact(/api/.*)$") {
        set $clean_uri $1;
    }
    fastcgi_param REQUEST_URI $clean_uri;
}

# ----------------------------------------------------
# SmartContact Frontend SPA (حل قطعی 404 و 500)
# ----------------------------------------------------
location ^~ /webapp/smartcontact {
    alias /www/wwwroot/ip.parszarasa.local/webapp/smartcontact/frontend/dist;
    index index.html;
    # اول فایل استاتیک رو چک میکنه، اگر نبود مستقیما به index.html مپ میشه بدون لوپ
    try_files $uri $uri/ /webapp/smartcontact/index.html =404;
}

# ریدایرکت داخلی امن برای فایل اصلی SPA
location = /webapp/smartcontact/index.html {
    alias /www/wwwroot/ip.parszarasa.local/webapp/smartcontact/frontend/dist/index.html;
    internal;
}
